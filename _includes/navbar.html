<!-- navbar.html -->
<nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="navbar__container">
    <a href="{{ '/' | relative_url }}" class="navbar__logo" aria-label="Home">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="GameLeaf logo" width="40" height="40">
      <span class="navbar__brand">GameLeaf</span>
    </a>

    <button class="navbar__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span class="navbar__toggle-bar" aria-hidden="true"></span>
      <span class="navbar__toggle-bar" aria-hidden="true"></span>
      <span class="navbar__toggle-bar" aria-hidden="true"></span>
    </button>

    <ul class="navbar__links" id="navLinks" role="menubar" aria-hidden="true">
      <li role="none">
        <a role="menuitem" href="{{ '/' | relative_url }}">Home</a>
      </li>

      <!-- About: link to /about/ + dropdown for subpages -->
      <li class="navbar__dropdown" role="none">
        <a class="navbar__dropdown-link" href="{{ '/about/' | relative_url }}" role="menuitem">About</a>

        <button
          class="navbar__dropdown-toggle"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="aboutDropdown"
          aria-label="Apri menu About"
        >
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>

        <ul class="navbar__dropdown-menu" id="aboutDropdown" role="menu" aria-hidden="true">
          <li role="none"><a role="menuitem" href="{{ '/about/who-we-are/' | relative_url }}">Who We Are</a></li>

        </ul>
      </li>

    <div class="navbar__search" role="search">
      <form id="navSearchForm" action="{{ '/search' | relative_url }}" method="get" aria-label="Site search">
        <label for="searchInput" class="sr-only">Search</label>
        <input
          type="search"
          name="q"
          id="searchInput"
          class="navbar__search-input"
          placeholder="Search..."
          aria-label="Search"
          autocomplete="off"
        >
        <button type="submit" class="navbar__search-btn" aria-label="Submit search">

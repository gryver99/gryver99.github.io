name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Check internal HTML (html-proofer)
        run: |
          gem install html-proofer -N
          # Flags: html-proofer 5 uses --[no-]option (not --option=true). --assume-extension takes a separate token.
          htmlproofer _site \
            --disable-external \
            --assume-extension .html \
            --no-enforce-https \
            --no-check-internal-hash \
            --ignore-missing-alt
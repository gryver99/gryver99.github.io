
<section class="ag-section">

  <div class="ag-header">
    <div class="ag-header-left">
      <span class="ag-section-tag">● Latest News</span>
      <h2 class="ag-title">News & Updates</h2>
    </div>
    <div class="ag-search-wrap">
      <svg class="ag-search-icon" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="ag-search" class="ag-search" placeholder="Cerca news..." oninput="agSearch()">
    </div>
  </div>

  <div class="ag-filters">
    <button class="ag-filter active" data-f="all" onclick="agFilter('all',this)">Tutti</button>
    <button class="ag-filter" data-f="new" onclick="agFilter('new',this)">New</button>
    <button class="ag-filter" data-f="news" onclick="agFilter('news',this)">News</button>
    <button class="ag-filter" data-f="coming soon" onclick="agFilter('coming soon',this)">Coming Soon</button>
    <button class="ag-filter" data-f="beta" onclick="agFilter('beta',this)">Beta</button>
    <button class="ag-filter" data-f="patch notes" onclick="agFilter('patch notes',this)">Patch Notes</button>
    <button class="ag-filter" data-f="redeem code" onclick="agFilter('redeem code',this)">Redeem Code</button>
  </div>

  <div class="ag-grid" id="ag-grid">
    {% for post in site.posts %}
    <a class="ag-card-link"
       href="{{ post.url | relative_url }}"
       data-title="{{ post.title | downcase }}"
       data-cat="{{ post.category | default: '' | downcase }}"
       data-badge="{{ post.badge | default: '' | downcase }}">
      <div class="ag-card">
        <div class="ag-thumb">
          {% if post.category %}
          <div class="ag-cat">{{ post.category }}</div>
          {% endif %}
          {% if post.badge %}
          <div class="ag-badge" data-b="{{ post.badge | downcase }}">{{ post.badge }}</div>
          {% endif %}
          <img
            src="{{ post.image | default: '/assets/images/placeholder.png' | relative_url }}"
            alt="{{ post.title }}"
            loading="lazy">
          <div class="ag-thumb-fade"></div>
        </div>
        <div class="ag-body">
          <span class="ag-date">{{ post.date | date: "%d %b %Y" }}</span>
          <h3 class="ag-card-title">{{ post.title }}</h3>
        </div>
      </div>
    </a>
    {% endfor %}
  </div>

  <div class="ag-empty-msg" id="ag-empty" style="display:none;">
    // nessun risultato trovato
  </div>

  <div class="ag-pagination" id="ag-pagination"></div>

</section>

<style>
.ag-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 48px 20px 60px;
  font-family: 'Rajdhani', sans-serif;
}

.ag-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.ag-header-left { display: flex; flex-direction: column; gap: 4px; }

.ag-section-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: #1dbb6c;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.ag-title {
  font-size: 28px;
  font-weight: 700;
  color: #e8f5e0;
  letter-spacing: 0.02em;
  margin: 0;
  line-height: 1;
}

.ag-search-wrap {
  position: relative;
  width: 240px;
}

.ag-search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px;
  color: #1dbb6c;
  pointer-events: none;
}

.ag-search {
  width: 100%;
  padding: 9px 14px 9px 34px;
  background: #0d1f10;
  border: 1px solid #1d3a20;
  border-radius: 6px;
  color: #c8e8c0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}
.ag-search::placeholder { color: #3a6040; }
.ag-search:focus { border-color: #1dbb6c; }

.ag-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.ag-filter {
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  background: #0d1f10;
  color: #4a7050;
  border: 1px solid #1d3a20;
}
.ag-filter:hover { color: #a0d8a0; border-color: #2e5534; }

.ag-filter.active[data-f="all"]         { background:#0d2e14; color:#1dbb6c; border-color:#1dbb6c; box-shadow:0 0 10px rgba(29,187,108,.2); }
.ag-filter.active[data-f="new"]         { background:#1e1800; color:#c8a84b; border-color:#c8a84b; box-shadow:0 0 10px rgba(200,168,75,.2); }
.ag-filter.active[data-f="news"]        { background:#001e1a; color:#00ddb4; border-color:#00ddb4; box-shadow:0 0 10px rgba(0,221,180,.2); }
.ag-filter.active[data-f="coming soon"] { background:#001428; color:#64a0ff; border-color:#64a0ff; box-shadow:0 0 10px rgba(100,160,255,.2); }
.ag-filter.active[data-f="beta"]        { background:#1e0c00; color:#ff9a3c; border-color:#ff9a3c; box-shadow:0 0 10px rgba(255,154,60,.2); }
.ag-filter.active[data-f="patch notes"] { background:#150020; color:#b478e0; border-color:#b478e0; box-shadow:0 0 10px rgba(180,120,224,.2); }
.ag-filter.active[data-f="redeem code"] { background:#00200c; color:#64c878; border-color:#64c878; box-shadow:0 0 10px rgba(100,200,120,.2); }

.ag-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

@media (max-width: 860px) { .ag-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 540px) { .ag-grid { grid-template-columns: 1fr; } .ag-search-wrap { width:100%; } }

.ag-card-link {
  text-decoration: none;
  color: inherit;
  display: none; /* gestito da JS */
}
.ag-card-link.ag-visible {
  display: block;
  opacity: 0;
  animation: agFadeUp 0.35s ease forwards;
}
@keyframes agFadeUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

.ag-card {
  background: #0d1f10;
  border: 1px solid #1d3a20;
  border-radius: 8px;
  overflow: hidden;
  height: 280px;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: border-color .25s, transform .25s, box-shadow .25s;
}
.ag-card-link:hover .ag-card {
  border-color: #1dbb6c;
  transform: translateY(-4px);
  box-shadow: 0 8px 28px rgba(29,187,108,.18);
}

.ag-thumb {
  position: relative;
  width: 100%;
  height: 165px;
  flex-shrink: 0;
  overflow: hidden;
  background: #091408;
}
.ag-thumb img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  opacity: 0;
  transition: opacity .3s, transform .4s;
}
.ag-thumb img.ag-loaded { opacity: 1; }
.ag-card-link:hover .ag-thumb img { transform: scale(1.05); }

.ag-thumb-fade {
  position: absolute; bottom:0; left:0; right:0;
  height: 55%;
  background: linear-gradient(to top, #0d1f10 0%, transparent 100%);
  z-index: 1;
}

.ag-cat {
  position: absolute; top:8px; left:8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 3px; z-index: 2;
  background: rgba(0,0,0,.7);
  color: #1dbb6c;
  border: 1px solid rgba(29,187,108,.4);
}

.ag-badge {
  position: absolute; top:8px; right:8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 3px; z-index: 2;
}
.ag-badge[data-b="new"]                               { background:rgba(200,168,75,.15);  color:#c8a84b; border:1px solid rgba(200,168,75,.4); }
.ag-badge[data-b="coming soon"]                       { background:rgba(100,160,255,.15); color:#64a0ff; border:1px solid rgba(100,160,255,.4); }
.ag-badge[data-b="beta"]                              { background:rgba(255,154,60,.15);  color:#ff9a3c; border:1px solid rgba(255,154,60,.4); }
.ag-badge[data-b="patch notes"],.ag-badge[data-b="patch"] { background:rgba(180,120,224,.15); color:#b478e0; border:1px solid rgba(180,120,224,.4); }
.ag-badge[data-b="redeem code"],.ag-badge[data-b="gift code"] { background:rgba(100,200,120,.15); color:#64c878; border:1px solid rgba(100,200,120,.4); }

.ag-body {
  padding: 10px 12px 12px;
  display: flex; flex-direction: column; gap: 5px;
  flex: 1;
}

.ag-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: #3a6a40; letter-spacing: .05em;
}

.ag-card-title {
  font-size: 15px; font-weight: 700;
  color: #d8f0d0; line-height: 1.25; margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  letter-spacing: .01em;
}
.ag-card-link:hover .ag-card-title { color: #7fe87a; }

.ag-empty-msg {
  text-align: center; padding: 60px 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; color: #2a4830; letter-spacing: .1em;
}

.ag-pagination {
  display: flex; justify-content: center;
  align-items: center; gap: 6px;
  margin-top: 36px; flex-wrap: wrap;
}

.ag-page-btn {
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px; font-weight: 700;
  padding: 6px 13px; min-width: 36px;
  background: #0d1f10; border: 1px solid #1d3a20;
  border-radius: 5px; color: #4a7050;
  cursor: pointer; transition: all .2s; letter-spacing: .05em;
}
.ag-page-btn:hover:not(:disabled) { border-color:#1dbb6c; color:#1dbb6c; background:#0d2e14; }
.ag-page-btn.active { background:#0d2e14; color:#1dbb6c; border-color:#1dbb6c; box-shadow:0 0 10px rgba(29,187,108,.2); }
.ag-page-btn:disabled { opacity:.25; cursor:not-allowed; }
.ag-page-dots { color:#2a4830; font-weight:700; padding:0 2px; font-family:'Rajdhani',sans-serif; }
</style>

<script>
(function(){
  const PER_PAGE = 12;
  let allCards = [], filtered = [], currentPage = 1, activeFilter = 'all', timer = null;

  function init() {
    allCards = Array.from(document.querySelectorAll('#ag-grid .ag-card-link'));
    allCards.forEach(c => {
      const img = c.querySelector('img');
      if (img) img.addEventListener('load', () => img.classList.add('ag-loaded'));
    });
    filtered = [...allCards];
    renderPage(1);
  }

  window.agFilter = function(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.ag-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
  };

  window.agSearch = function() {
    clearTimeout(timer);
    timer = setTimeout(applyFilter, 200);
  };

  function applyFilter() {
    const q = (document.getElementById('ag-search')?.value || '').toLowerCase().trim();
    filtered = allCards.filter(c => {
      const title = c.dataset.title || '';
      const cat   = c.dataset.cat   || '';
      const badge = c.dataset.badge || '';
      const matchFilter = activeFilter === 'all' || badge === activeFilter || cat === activeFilter;
      const matchSearch = !q || title.includes(q) || cat.includes(q) || badge.includes(q);
      return matchFilter && matchSearch;
    });
    renderPage(1);
  }

  function renderPage(page) {
    currentPage = page;
    allCards.forEach(c => c.classList.remove('ag-visible'));

    const empty = document.getElementById('ag-empty');
    if (!filtered.length) {
      empty.style.display = 'block';
      document.getElementById('ag-pagination').innerHTML = '';
      return;
    }
    empty.style.display = 'none';

    const slice = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);
    slice.forEach((c, i) => {
      c.style.animationDelay = (i * 0.045) + 's';
      c.classList.add('ag-visible');
    });

    buildPagination();
  }

  function buildPagination() {
    const pag = document.getElementById('ag-pagination');
    pag.innerHTML = '';
    const total = Math.ceil(filtered.length / PER_PAGE);
    if (total <= 1) return;

    const max = 5;
    let s = Math.max(1, currentPage - 2);
    let e = Math.min(total, s + max - 1);
    if (e - s < max - 1) s = Math.max(1, e - max + 1);

    addBtn(pag, '‹', currentPage === 1, () => go(currentPage - 1));
    if (s > 1) { addBtn(pag, '1', false, () => go(1)); if (s > 2) addDots(pag); }
    for (let i = s; i <= e; i++) addBtn(pag, i, false, () => go(i), i === currentPage);
    if (e < total) { if (e < total-1) addDots(pag); addBtn(pag, total, false, () => go(total)); }
    addBtn(pag, '›', currentPage === total, () => go(currentPage + 1));
  }

  function go(p) {
    renderPage(p);
    document.querySelector('.ag-section')?.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function addBtn(p, txt, disabled, fn, active=false) {
    const b = document.createElement('button');
    b.className = 'ag-page-btn' + (active ? ' active' : '');
    b.textContent = txt; b.disabled = disabled; b.onclick = fn;
    p.appendChild(b);
  }

  function addDots(p) {
    const s = document.createElement('span');
    s.className = 'ag-page-dots'; s.textContent = '…';
    p.appendChild(s);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

<!-- _includes/video-carousel.html -->

<div class="gl-vc-wrap">
  <div class="gl-vc-shell" id="gl-vc-widget" aria-label="Featured videos" data-json-path="{{ '/data/videos.json' | relative_url }}">

    <!-- ── HEADER ── -->
    <div class="gl-vc-header">
      <div class="gl-vc-brand">

        <!-- LOGO -->
        <div class="gl-logo-wrap">
          <img
            src="{{ '/assets/images/logo.webp' | relative_url }}"
            alt="GameLeaf"
            class="gl-logo-img"
            width="200"
            height="48"
            decoding="async"
            onerror="if(this.dataset.tried){this.style.display='none';document.getElementById('gl-logo-svg').style.display='block';}else{this.dataset.tried=1;this.src='{{ "/assets/images/icon.png" | relative_url }}';}">

          <!-- SVG fallback — visibile SOLO se il PNG non carica -->
          <svg id="gl-logo-svg" style="display:none;overflow:visible;filter:drop-shadow(0 0 10px rgba(57,255,140,.4))"
               viewBox="0 0 190 46" width="190" height="46" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gl-grad-logo" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#39ff8c"/>
                <stop offset="100%" stop-color="#22d46b"/>
              </linearGradient>
            </defs>
            <path d="M14 5 C4 5 2 17 2 24 C10 22 18 16 20 9 C22 16 30 22 38 24 C38 16 36 5 26 5 C24 5 20 6.5 20 6.5 C20 6.5 16 5 14 5Z" fill="url(#gl-grad-logo)"/>
            <line x1="20" y1="9" x2="20" y2="28" stroke="#39ff8c" stroke-width="1.8" stroke-linecap="round"/>
            <text x="47" y="32" font-family="'Exo 2',Arial Black,sans-serif" font-weight="900" font-size="24" fill="url(#gl-grad-logo)" letter-spacing="-0.3">Game</text>
            <text x="112" y="32" font-family="'Exo 2',Arial Black,sans-serif" font-weight="900" font-size="24" fill="#dff5e8" letter-spacing="-0.3">Leaf</text>
          </svg>
        </div>

        <div class="gl-divider" aria-hidden="true"></div>

        <div class="gl-title-group">
          <div class="gl-eyebrow">
            <span class="gl-pulse-dot" aria-hidden="true"></span>
            FEATURED VIDEOS
          </div>
          <h3 class="gl-title">Watch &amp; Explore</h3>
        </div>
      </div>

      <div class="gl-controls" role="toolbar" aria-label="Controls">
        <span class="gl-count" id="gl-count" aria-live="polite">— / —</span>
        <button id="gl-playpause" class="gl-btn-pill" aria-pressed="true" aria-label="Pausa autoplay">
          <svg class="gl-icon-pause" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg class="gl-icon-play"  width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"/></svg>
          <span class="gl-btn-label">PAUSE</span>
        </button>
      </div>
    </div>

    <!-- ── PROGRESS BAR ── -->
    <div class="gl-progress-track" role="progressbar" aria-label="Autoplay progress">
      <div class="gl-progress-bar" id="gl-progress"></div>
    </div>

    <!-- ── CAROUSEL ── -->
    <div class="gl-stage">
      <button id="gl-prev" class="gl-arrow gl-arrow--left" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="gl-carousel" id="gl-carousel" role="region" aria-live="polite">
        <div class="gl-slot" data-slot="0"></div>
        <div class="gl-slot" data-slot="1"></div>
        <div class="gl-slot" data-slot="2"></div>
      </div>
      <button id="gl-next" class="gl-arrow gl-arrow--right" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- ── FOOTER ── -->
    <div class="gl-vc-footer">
      <div class="gl-vc-note">
        <span class="gl-pulse-dot" aria-hidden="true"></span>
        Discover new gameplay every day
      </div>
      <div class="gl-pager" id="gl-pager" role="tablist" aria-label="Pages"></div>
    </div>

  </div>
</div>

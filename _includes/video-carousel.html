<!-- _includes/video-carousel.html -->

<div class="gl-vc-wrap">
  <div class="gl-vc-shell" id="gl-vc-widget" aria-label="Video in evidenza">

    <!-- ── HEADER ── -->
    <div class="gl-vc-header">
      <div class="gl-vc-brand">

        <!-- LOGO -->
        <div class="gl-logo-wrap">
          <img
            src="{{ '/assets/images/logo.png' | relative_url }}"
            alt="GameLeaf"
            class="gl-logo-img"
            onerror="if(this.dataset.tried){this.style.display='none';document.getElementById('gl-logo-svg').style.display='block';}else{this.dataset.tried=1;this.src='{{ "/assets/images/icon.png" | relative_url }}';}">

          <!-- SVG fallback — visibile SOLO se il PNG non carica -->
          <svg id="gl-logo-svg" style="display:none;overflow:visible;filter:drop-shadow(0 0 10px rgba(57,255,140,.4))"
               viewBox="0 0 190 46" width="190" height="46" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gl-grad-logo" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#39ff8c"/>
                <stop offset="100%" stop-color="#22d46b"/>
              </linearGradient>
            </defs>
            <path d="M14 5 C4 5 2 17 2 24 C10 22 18 16 20 9 C22 16 30 22 38 24 C38 16 36 5 26 5 C24 5 20 6.5 20 6.5 C20 6.5 16 5 14 5Z" fill="url(#gl-grad-logo)"/>
            <line x1="20" y1="9" x2="20" y2="28" stroke="#39ff8c" stroke-width="1.8" stroke-linecap="round"/>
            <text x="47" y="32" font-family="'Exo 2',Arial Black,sans-serif" font-weight="900" font-size="24" fill="url(#gl-grad-logo)" letter-spacing="-0.3">Game</text>
            <text x="112" y="32" font-family="'Exo 2',Arial Black,sans-serif" font-weight="900" font-size="24" fill="#dff5e8" letter-spacing="-0.3">Leaf</text>
          </svg>
        </div>

        <div class="gl-divider" aria-hidden="true"></div>

        <div class="gl-title-group">
          <div class="gl-eyebrow">
            <span class="gl-pulse-dot" aria-hidden="true"></span>
            FEATURED VIDEOS
          </div>
          <h3 class="gl-title">Watch &amp; Explore</h3>
        </div>
      </div>

      <div class="gl-controls" role="toolbar" aria-label="Controlli">
        <span class="gl-count" id="gl-count" aria-live="polite">— / —</span>
        <button id="gl-playpause" class="gl-btn-pill" aria-pressed="true" aria-label="Pausa autoplay">
          <svg class="gl-icon-pause" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg class="gl-icon-play"  width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"/></svg>
          <span class="gl-btn-label">PAUSE</span>
        </button>
      </div>
    </div>

    <!-- ── PROGRESS BAR ── -->
    <div class="gl-progress-track" role="progressbar" aria-label="Autoplay progress">
      <div class="gl-progress-bar" id="gl-progress"></div>
    </div>

    <!-- ── CAROUSEL ── -->
    <div class="gl-stage">
      <button id="gl-prev" class="gl-arrow gl-arrow--left" aria-label="Precedente">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="gl-carousel" id="gl-carousel" role="region" aria-live="polite">
        <div class="gl-slot" data-slot="0"></div>
        <div class="gl-slot" data-slot="1"></div>
        <div class="gl-slot" data-slot="2"></div>
      </div>
      <button id="gl-next" class="gl-arrow gl-arrow--right" aria-label="Successivo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- ── FOOTER ── -->
    <div class="gl-footer">
      <div class="gl-vc-note">
        <span class="gl-pulse-dot" aria-hidden="true"></span>
        Discover new gameplay every day
      </div>
      <div class="gl-pager" id="gl-pager" role="tablist" aria-label="Pagine"></div>
    </div>

  </div>
</div>

<style>
:root{
  --gl-neon:  #39ff8c;
  --gl-ndim:  #22d46b;
  --gl-card:  #0b1d12;
  --gl-text:  #dff5e8;
  --gl-muted: rgba(223,245,232,.5);
  --gl-r:     16px;
  --gl-rs:    10px;
  --gl-f:    'Exo 2',sans-serif;
  --gl-fh:   'Orbitron',monospace;
  --gl-fu:   'Rajdhani',sans-serif;
  --gl-glow:  0 0 20px rgba(57,255,140,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.gl-vc-wrap{max-width:1220px;margin:36px auto;padding:0 16px;font-family:var(--gl-f)}

.gl-vc-shell{
  background:linear-gradient(160deg,#0e2218 0%,#071510 50%,#081a10 100%);
  border:1px solid rgba(57,255,140,.18);
  border-radius:var(--gl-r);
  padding:22px 20px 18px;
  color:var(--gl-text);
  box-shadow:0 24px 64px rgba(0,0,0,.75),inset 0 1px 0 rgba(57,255,140,.06);
  position:relative;
  /* overflow:visible — fondamentale per non tagliare il logo SVG o PNG */
  overflow:visible;
}
.gl-vc-shell::before{
  content:"";position:absolute;top:-60px;left:-60px;width:300px;height:260px;
  background:radial-gradient(ellipse,rgba(57,255,140,.09) 0%,transparent 70%);
  pointer-events:none;border-radius:50%;z-index:0;
}

/* HEADER */
.gl-vc-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;position:relative;z-index:2}
.gl-vc-brand{display:flex;align-items:center;gap:14px}

/* LOGO — overflow:visible per non tagliare nulla */
.gl-logo-wrap{flex-shrink:0;display:flex;align-items:center;overflow:visible}
.gl-logo-img{
  height:48px;width:auto;max-width:200px;
  display:block;object-fit:contain;
  filter:drop-shadow(0 0 12px rgba(57,255,140,.5)) drop-shadow(0 3px 8px rgba(0,0,0,.5));
  transition:filter .25s;
}
.gl-logo-img:hover{filter:drop-shadow(0 0 22px rgba(57,255,140,.75)) drop-shadow(0 3px 8px rgba(0,0,0,.5))}

.gl-divider{width:1px;height:34px;background:linear-gradient(to bottom,transparent,rgba(57,255,140,.22),transparent);flex-shrink:0}

.gl-title-group{display:flex;flex-direction:column;gap:3px}
.gl-eyebrow{display:flex;align-items:center;gap:7px;font-family:var(--gl-fu);font-size:10px;font-weight:700;letter-spacing:3px;color:var(--gl-neon);text-transform:uppercase}
.gl-title{font-family:var(--gl-fh);font-size:16px;font-weight:900;color:var(--gl-text);letter-spacing:.5px}

.gl-pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--gl-neon);flex-shrink:0;box-shadow:0 0 8px rgba(57,255,140,.5);animation:gl-pulse 2.2s ease-in-out infinite}
@keyframes gl-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

.gl-controls{display:flex;align-items:center;gap:10px}
.gl-count{font-family:var(--gl-fu);font-size:12px;font-weight:600;color:var(--gl-muted);letter-spacing:1px;min-width:52px;text-align:right}
.gl-btn-pill{
  display:flex;align-items:center;gap:7px;
  background:rgba(57,255,140,.06);border:1.5px solid rgba(57,255,140,.3);color:var(--gl-neon);
  padding:8px 15px;border-radius:var(--gl-rs);
  font-family:var(--gl-fu);font-weight:700;font-size:12px;letter-spacing:1.5px;
  cursor:pointer;white-space:nowrap;transition:all .2s;box-shadow:0 0 12px rgba(57,255,140,.15);
}
.gl-btn-pill:hover{background:rgba(57,255,140,.12);border-color:var(--gl-neon);box-shadow:var(--gl-glow);transform:translateY(-1px)}
.gl-btn-pill:active{transform:translateY(0)}

/* PROGRESS */
.gl-progress-track{height:3px;background:rgba(57,255,140,.07);border-radius:2px;margin-bottom:18px;overflow:hidden;position:relative;z-index:2}
.gl-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gl-ndim),var(--gl-neon) 60%,rgba(255,255,255,.7));border-radius:2px;box-shadow:0 0 10px rgba(57,255,140,.7);transition:width .12s linear;position:relative}
.gl-progress-bar::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--gl-neon)}

/* STAGE */
.gl-stage{display:flex;align-items:center;position:relative;z-index:2}

.gl-arrow{
  width:40px;height:40px;flex-shrink:0;
  background:rgba(4,16,8,.7);backdrop-filter:blur(6px);
  border:1.5px solid rgba(57,255,140,.22);border-radius:50%;color:var(--gl-neon);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s;box-shadow:0 4px 16px rgba(0,0,0,.5);
}
.gl-arrow:hover{background:rgba(57,255,140,.12);border-color:var(--gl-neon);box-shadow:var(--gl-glow);transform:scale(1.08)}
.gl-arrow:active{transform:scale(.96)}
.gl-arrow--left{margin-right:10px}
.gl-arrow--right{margin-left:10px}

.gl-carousel{display:flex;gap:14px;flex:1;align-items:stretch}

.gl-slot{flex:1;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.gl-slot:hover{transform:translateY(-5px)}

/* CARD */
.gl-thumb{
  position:relative;width:100%;aspect-ratio:16/9;display:block;
  border-radius:12px;overflow:hidden;
  background:var(--gl-card);
  border:1.5px solid rgba(57,255,140,.12);
  box-shadow:0 8px 30px rgba(0,0,0,.65);
  text-decoration:none;
  transition:border-color .22s,box-shadow .22s;
}
.gl-thumb:hover{border-color:rgba(57,255,140,.55);box-shadow:0 12px 42px rgba(0,0,0,.75),0 0 30px rgba(57,255,140,.2)}

.gl-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease,filter .22s;filter:saturate(1.1) brightness(.9)}
.gl-thumb:hover img{transform:scale(1.05);filter:saturate(1.2) brightness(1.0)}

.gl-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(4,12,8,.88) 0%,rgba(4,12,8,.4) 40%,transparent 65%);pointer-events:none;z-index:1}

.gl-thumb-title{
  position:absolute;bottom:0;left:0;right:0;padding:10px 12px 12px;
  font-family:var(--gl-f);font-weight:700;font-size:13px;color:var(--gl-text);
  line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.95);
}

.gl-corner{position:absolute;width:14px;height:14px;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
.gl-corner--tl{top:7px;left:7px;border-top:2px solid var(--gl-neon);border-left:2px solid var(--gl-neon);border-radius:2px 0 0 0;transform:translate(-3px,-3px)}
.gl-corner--tr{top:7px;right:7px;border-top:2px solid var(--gl-neon);border-right:2px solid var(--gl-neon);border-radius:0 2px 0 0;transform:translate(3px,-3px)}
.gl-corner--bl{bottom:7px;left:7px;border-bottom:2px solid var(--gl-neon);border-left:2px solid var(--gl-neon);border-radius:0 0 0 2px;transform:translate(-3px,3px)}
.gl-corner--br{bottom:7px;right:7px;border-bottom:2px solid var(--gl-neon);border-right:2px solid var(--gl-neon);border-radius:0 0 2px 0;transform:translate(3px,3px)}
.gl-thumb:hover .gl-corner{opacity:1;transform:translate(0,0)}

/* ── PLAY BUTTON: quasi invisibile → si accende all'hover ── */
.gl-playwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.gl-play{
  width:52px;height:52px;border-radius:50%;
  background:rgba(4,16,8,.18);
  backdrop-filter:blur(2px);
  border:2px solid rgba(57,255,140,.25);
  display:flex;align-items:center;justify-content:center;
  opacity:.55;
  box-shadow:none;
  transition:
    transform   .24s cubic-bezier(.34,1.56,.64,1),
    background  .28s ease,
    border-color .28s ease,
    box-shadow  .28s ease,
    opacity     .28s ease;
}
.gl-play svg{
  width:20px;height:20px;fill:var(--gl-neon);
  transform:translateX(2px);
  filter:drop-shadow(0 0 2px rgba(57,255,140,.3));
  transition:filter .28s ease;
}
.gl-thumb:hover .gl-play{
  transform:scale(1.20);
  background:rgba(4,22,12,.74);
  border-color:rgba(57,255,140,.95);
  opacity:1;
  box-shadow:
    0 0 52px rgba(57,255,140,.65),
    0 0 20px rgba(57,255,140,.35),
    inset 0 0 24px rgba(57,255,140,.12);
}
.gl-thumb:hover .gl-play svg{
  filter:drop-shadow(0 0 10px var(--gl-neon)) drop-shadow(0 0 4px rgba(255,255,255,.5));
}

/* meta row */
.gl-slot-meta{display:flex;align-items:center;gap:6px;margin-top:9px;padding:0 2px}
.gl-slot-sub{font-family:var(--gl-fu);font-size:11px;color:var(--gl-neon);opacity:.7;letter-spacing:.3px}
.gl-watch-link{
  display:flex;align-items:center;gap:4px;margin-left:auto;
  font-family:var(--gl-fu);font-size:11px;color:var(--gl-muted);letter-spacing:.8px;
  text-decoration:none;opacity:0;transform:translateX(4px);
  transition:opacity .18s,transform .18s,color .18s;
}
.gl-slot:hover .gl-watch-link{opacity:1;transform:translateX(0);color:var(--gl-neon)}

/* FOOTER */
.gl-vc-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(57,255,140,.07);position:relative;z-index:2}
.gl-vc-note{font-family:var(--gl-fu);font-size:12px;font-weight:500;color:var(--gl-muted);letter-spacing:.3px;display:flex;align-items:center;gap:8px}

.gl-pager{display:flex;gap:7px;align-items:center}
.gl-dot{width:8px;height:8px;border-radius:50%;background:rgba(57,255,140,.15);border:1px solid rgba(57,255,140,.3);cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;padding:0}
.gl-dot.active{background:var(--gl-neon);box-shadow:0 0 10px rgba(57,255,140,.6);width:24px;border-radius:4px;border-color:var(--gl-neon)}
.gl-dot:hover:not(.active){background:rgba(57,255,140,.4);transform:scale(1.2)}

/* RESPONSIVE */
@media(max-width:900px){
  .gl-arrow{width:34px;height:34px}
  .gl-play{width:42px;height:42px}
  .gl-play svg{width:16px;height:16px}
  .gl-logo-img{height:42px}
}
@media(max-width:650px){
  .gl-vc-shell{padding:14px 12px 12px}
  .gl-carousel{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding-bottom:4px;flex-wrap:nowrap}
  .gl-slot{min-width:200px;scroll-snap-align:start;flex-shrink:0}
  .gl-title{font-size:13px}
  .gl-btn-label,.gl-count,.gl-divider{display:none}
  .gl-btn-pill{padding:8px 10px}
  .gl-arrow{display:none}
}
</style>

<script>
(function(){
const VC={jsonPath:'{{ "/data/videos.json" | relative_url }}',maxPick:30,vis:3,autoSec:7,openModal:false};
let all=[],set=[],page=0,timer=null,playing=true;

function getId(item){
  const r=(item.id||'').toString().trim();if(!r)return '';
  if(r.includes('youtube.com')||r.includes('youtu.be')){
    try{const u=new URL(r);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).trim();return(u.searchParams.get('v')||'').trim();}
    catch(e){return r.trim();}
  }
  return r;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

async function load(){
  try{
    const res=await fetch(VC.jsonPath,{cache:'no-cache'});
    if(!res.ok)throw new Error('videos.json non trovato');
    const json=await res.json();
    all=(json.items||[]).map(it=>({...it,id:getId(it)})).filter(it=>it.id);
    if(!all.length)throw new Error('Nessun video valido');
    init();
  }catch(err){
    const w=document.getElementById('gl-vc-widget');
    if(w)w.innerHTML=`<div style="padding:24px;color:#39ff8c;font-family:Rajdhani,sans-serif;font-size:14px;letter-spacing:1px;background:rgba(57,255,140,.04);border:1px solid rgba(57,255,140,.12);border-radius:12px">⚠ Impossibile caricare i video — verifica il percorso di videos.json.<br><small style="opacity:.6">${err.message}</small></div>`;
  }
}

function init(){set=shuffle(all.slice()).slice(0,Math.min(VC.maxPick,all.length));page=0;render();buildPager();updateCount();startAuto();}

function render(){
  const slots=document.querySelectorAll('.gl-slot');
  const start=page*VC.vis;
  slots.forEach((slot,i)=>{
    slot.innerHTML='';
    const item=set[start+i];
    if(!item){slot.innerHTML='<div style="aspect-ratio:16/9;background:rgba(57,255,140,.03);border:1px solid rgba(57,255,140,.07);border-radius:12px"></div>';return;}
    const vidUrl='https://www.youtube.com/watch?v='+encodeURIComponent(item.id);

    const thumb=document.createElement('a');
    thumb.className='gl-thumb';thumb.href=vidUrl;thumb.target='_blank';thumb.rel='noopener noreferrer';
    thumb.setAttribute('aria-label',(item.title||'Video')+' — guarda su YouTube');

    const img=document.createElement('img');
    img.src='https://i.ytimg.com/vi/'+encodeURIComponent(item.id)+'/hqdefault.jpg';
    img.alt=item.title||'';img.loading='lazy';
    thumb.appendChild(img);

    const ov=document.createElement('div');ov.className='gl-thumb-overlay';thumb.appendChild(ov);
    ['tl','tr','bl','br'].forEach(p=>{const c=document.createElement('div');c.className='gl-corner gl-corner--'+p;thumb.appendChild(c);});

    const tl=document.createElement('div');tl.className='gl-thumb-title';tl.textContent=item.title||'';thumb.appendChild(tl);

    const pw=document.createElement('div');pw.className='gl-playwrap';
    const pl=document.createElement('div');pl.className='gl-play';pl.setAttribute('aria-hidden','true');
    pl.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    pw.appendChild(pl);thumb.appendChild(pw);

    if(VC.openModal){thumb.addEventListener('click',e=>{e.preventDefault();openModal(item.id,item.title);});}
    slot.appendChild(thumb);

    if(item.publishedAt){
      const meta=document.createElement('div');meta.className='gl-slot-meta';
      const sub=document.createElement('div');sub.className='gl-slot-sub';sub.textContent='◆ '+item.publishedAt;meta.appendChild(sub);
      const wl=document.createElement('a');wl.className='gl-watch-link';wl.href=vidUrl;wl.target='_blank';wl.rel='noopener noreferrer';
      wl.innerHTML='WATCH <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>';
      meta.appendChild(wl);slot.appendChild(meta);
    }
  });
}

function buildPager(){
  const pager=document.getElementById('gl-pager');if(!pager)return;
  const pages=Math.ceil(set.length/VC.vis);pager.innerHTML='';
  for(let i=0;i<Math.min(pages,12);i++){
    const d=document.createElement('button');
    d.className='gl-dot'+(i===page?' active':'');
    d.setAttribute('role','tab');d.setAttribute('aria-label','Pagina '+(i+1));
    d.setAttribute('aria-selected',i===page?'true':'false');
    d.addEventListener('click',()=>{page=i;render();syncPager();updateCount();resetAuto();});
    pager.appendChild(d);
  }
}
function syncPager(){document.querySelectorAll('.gl-dot').forEach((d,i)=>{d.classList.toggle('active',i===page);d.setAttribute('aria-selected',i===page?'true':'false');});}
function updateCount(){const el=document.getElementById('gl-count');if(!el)return;const s=page*VC.vis+1,e=Math.min(s+VC.vis-1,set.length);el.textContent=s+'–'+e+' / '+set.length;}

function startProgress(){
  const b=document.getElementById('gl-progress');if(!b)return;
  b.style.transition='none';b.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition=`width ${VC.autoSec}s linear`;b.style.width='100%';}));
}
function stopProgress(){const b=document.getElementById('gl-progress');if(!b)return;b.style.transition='none';b.style.width='0%';}
function next(){const p=Math.ceil(set.length/VC.vis);page=(page+1)%p;render();syncPager();updateCount();}
function prev(){const p=Math.ceil(set.length/VC.vis);page=(page-1+p)%p;render();syncPager();updateCount();}
function startAuto(){stopAuto();if(!playing)return;startProgress();timer=setInterval(()=>{next();startProgress();},VC.autoSec*1000);}
function stopAuto(){if(timer){clearInterval(timer);timer=null;}stopProgress();}
function resetAuto(){stopAuto();startAuto();}

document.addEventListener('click',e=>{
  if(e.target.closest('#gl-next')){next();resetAuto();}
  if(e.target.closest('#gl-prev')){prev();resetAuto();}
  if(e.target.closest('#gl-playpause')){
    playing=!playing;
    const btn=document.getElementById('gl-playpause');
    btn.querySelector('.gl-icon-pause').style.display=playing?'':'none';
    btn.querySelector('.gl-icon-play').style.display=playing?'none':'';
    btn.querySelector('.gl-btn-label').textContent=playing?'PAUSE':'PLAY';
    btn.setAttribute('aria-pressed',playing?'true':'false');
    if(playing)startAuto();else stopAuto();
  }
});

window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){next();resetAuto();}if(e.key==='ArrowLeft'){prev();resetAuto();}});

const w=document.getElementById('gl-vc-widget');
if(w){w.addEventListener('mouseenter',()=>stopAuto());w.addEventListener('mouseleave',()=>{if(playing)startAuto();});}

function openModal(id,title){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(2,8,4,.92);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:9999;';
  const box=document.createElement('div');
  box.style.cssText='width:92%;max-width:1080px;aspect-ratio:16/9;position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(57,255,140,.35);box-shadow:0 0 80px rgba(57,255,140,.18),0 32px 80px rgba(0,0,0,.8);';
  const cb=document.createElement('button');
  cb.style.cssText='position:absolute;top:-44px;right:0;background:rgba(57,255,140,.08);border:1px solid rgba(57,255,140,.25);color:#39ff8c;font-family:Rajdhani,sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;padding:8px 16px;border-radius:8px;cursor:pointer;';
  cb.textContent='✕  CHIUDI';
  const fr=document.createElement('iframe');
  fr.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0';
  fr.style.cssText='width:100%;height:100%;border:0;';fr.title=title||'Video';fr.allow='autoplay; encrypted-media; picture-in-picture';
  box.appendChild(cb);box.appendChild(fr);ov.appendChild(box);document.body.appendChild(ov);
  const close=()=>{document.body.removeChild(ov);window.removeEventListener('keydown',onK);};
  cb.addEventListener('click',close);ov.addEventListener('click',e=>{if(e.target===ov)close();});
  function onK(e){if(e.key==='Escape')close();}
  window.addEventListener('keydown',onK);
}

load();
})();

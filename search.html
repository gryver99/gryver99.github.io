---
layout: default
title: Search
permalink: /search/
---

<section class="search-page">
  <div class="container">
    <h1>Search results</h1>

    <form id="searchForm" role="search" aria-label="Search form" novalidate>
      <label for="q" class="sr-only">Search</label>
      <input id="q" name="q" type="search" value="" placeholder="Search..." aria-label="Search" required minlength="2" maxlength="80" pattern=".*\S.*" title="Insert at least 2 non-space characters.">
      <button type="submit" aria-label="Submit search"><i class="fas fa-search"></i></button>
    </form>

    <div id="searchMeta" class="search-meta" aria-live="polite"></div>
    <ul id="searchResults" class="search-results" role="list"></ul>
  </div>
</section>

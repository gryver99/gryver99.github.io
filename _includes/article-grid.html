
<section class="ag-section">

  <div class="ag-header">
    <div class="ag-header-left">
      <span class="ag-section-tag">● Latest News</span>
      <h2 class="ag-title">News & Updates</h2>
    </div>
    <div class="ag-search-wrap">
      <svg class="ag-search-icon" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="ag-search" class="ag-search" placeholder="search news..." oninput="agSearch()">
    </div>
  </div>

  <div class="ag-filters">
    <button class="ag-filter active" data-f="all" onclick="agFilter('all',this)">All</button>
    <button class="ag-filter" data-f="new" onclick="agFilter('new',this)">New</button>
    <button class="ag-filter" data-f="news" onclick="agFilter('news',this)">News</button>
    <button class="ag-filter" data-f="coming soon" onclick="agFilter('coming soon',this)">Coming Soon</button>
    <button class="ag-filter" data-f="beta" onclick="agFilter('beta',this)">Beta</button>
    <button class="ag-filter" data-f="patch notes" onclick="agFilter('patch notes',this)">Patch Notes</button>
    <button class="ag-filter" data-f="redeem code" onclick="agFilter('redeem code',this)">Redeem Code</button>
  </div>

  <div class="ag-grid" id="ag-grid">
    {% for post in site.posts %}
    <a class="ag-card-link"
       href="{{ post.url | relative_url }}"
       data-title="{{ post.title | downcase }}"
       data-cat="{{ post.category | default: '' | downcase }}"
       data-badge="{{ post.badge | default: '' | downcase }}">
      <div class="ag-card">
        <div class="ag-thumb">
          {% if post.category %}
          <div class="ag-cat">{{ post.category }}</div>
          {% endif %}
          {% if post.badge %}
          <div class="ag-badge" data-b="{{ post.badge | downcase }}">{{ post.badge }}</div>
          {% endif %}
          <img
            src="{{ post.image | default: '/assets/images/placeholder.jpg' | relative_url }}"
            alt="{{ post.title }}"
            loading="lazy">
          <div class="ag-thumb-fade"></div>
        </div>
        <div class="ag-body">
          <span class="ag-date">{{ post.date | date: "%d %b %Y" }}</span>
          <h3 class="ag-card-title">{{ post.title }}</h3>
        </div>
      </div>
    </a>
    {% endfor %}
  </div>

  <div class="ag-empty-msg" id="ag-empty" style="display:none;">
    No results found
  </div>

  <div class="ag-pagination" id="ag-pagination"></div>

</section>

<script>
(function(){
  const PER_PAGE = 12;
  let allCards = [], filtered = [], currentPage = 1, activeFilter = 'all', timer = null;

  function init() {
    allCards = Array.from(document.querySelectorAll('#ag-grid .ag-card-link'));
    allCards.forEach(c => {
      const img = c.querySelector('img');
      if (img) img.addEventListener('load', () => img.classList.add('ag-loaded'));
    });
    filtered = [...allCards];
    renderPage(1);
  }

  window.agFilter = function(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.ag-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
  };

  window.agSearch = function() {
    clearTimeout(timer);
    timer = setTimeout(applyFilter, 200);
  };

  function applyFilter() {
    const q = (document.getElementById('ag-search')?.value || '').toLowerCase().trim();
    filtered = allCards.filter(c => {
      const title = c.dataset.title || '';
      const cat   = c.dataset.cat   || '';
      const badge = c.dataset.badge || '';
      const matchFilter = activeFilter === 'all' || badge === activeFilter || cat === activeFilter;
      const matchSearch = !q || title.includes(q) || cat.includes(q) || badge.includes(q);
      return matchFilter && matchSearch;
    });
    renderPage(1);
  }

  function renderPage(page) {
    currentPage = page;
    allCards.forEach(c => c.classList.remove('ag-visible'));

    const empty = document.getElementById('ag-empty');
    if (!filtered.length) {
      empty.style.display = 'block';
      document.getElementById('ag-pagination').innerHTML = '';
      return;
    }
    empty.style.display = 'none';

    const slice = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);
    slice.forEach((c, i) => {
      c.style.animationDelay = (i * 0.045) + 's';
      c.classList.add('ag-visible');
    });

    buildPagination();
  }

  function buildPagination() {
    const pag = document.getElementById('ag-pagination');
    pag.innerHTML = '';
    const total = Math.ceil(filtered.length / PER_PAGE);
    if (total <= 1) return;

    const max = 5;
    let s = Math.max(1, currentPage - 2);
    let e = Math.min(total, s + max - 1);
    if (e - s < max - 1) s = Math.max(1, e - max + 1);

    addBtn(pag, '‹', currentPage === 1, () => go(currentPage - 1));
    if (s > 1) { addBtn(pag, '1', false, () => go(1)); if (s > 2) addDots(pag); }
    for (let i = s; i <= e; i++) addBtn(pag, i, false, () => go(i), i === currentPage);
    if (e < total) { if (e < total-1) addDots(pag); addBtn(pag, total, false, () => go(total)); }
    addBtn(pag, '›', currentPage === total, () => go(currentPage + 1));
  }

  function go(p) {
    renderPage(p);
    document.querySelector('.ag-section')?.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function addBtn(p, txt, disabled, fn, active=false) {
    const b = document.createElement('button');
    b.className = 'ag-page-btn' + (active ? ' active' : '');
    b.textContent = txt; b.disabled = disabled; b.onclick = fn;
    p.appendChild(b);
  }

  function addDots(p) {
    const s = document.createElement('span');
    s.className = 'ag-page-dots'; s.textContent = '…';
    p.appendChild(s);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
